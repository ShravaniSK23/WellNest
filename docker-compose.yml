version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: wellnest_postgres
    restart: always
    environment:
      POSTGRES_USER: wellnest_user
      POSTGRES_PASSWORD: wellnest_password
      POSTGRES_DB: wellnest_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellnest_user -d wellnest_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
